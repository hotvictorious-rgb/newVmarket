name: Paystack refund safety tests

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/Http/Controllers/Web/PaystackPaymentController.php"
      - "backend/app/Services/FinancialReconciliationEngine.php"
      - "backend/tests/Feature/FinancialAuditRemediationProofTest.php"
      - "backend/tests/Feature/PaystackPaymentHardeningTest.php"
      - "backend/**"
      - ".github/workflows/paystack-refund-safety.yml"
  push:
    branches: [audit/paystack-refund-webhook-safety]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refund-safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_KEY: "base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI="
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, curl, dom, fileinfo, mbstring, pdo_sqlite, sqlite3, xml
          coverage: none

      - name: Prepare test environment
        run: touch .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check for changed files
        run: |
          php -l app/Http/Controllers/Web/PaystackPaymentController.php
          php -l app/Services/FinancialReconciliationEngine.php
          php -l app/Services/PaystackService.php
          php -l app/Services/ReturnAndRefundService.php
          php -l app/Services/DoorstepHandshakeService.php
          php -l app/Http/Controllers/Api/RiderTerminalApiController.php
          php -l app/Services/NotificationDispatchService.php
          php -l app/Services/CheckoutExecutionService.php
          php -l app/Models/Order.php
          php -l database/migrations/2026_10_20_000046_add_customer_address_id_to_orders.php
          php -l tests/Feature/DoorstepPartialAcceptanceAndVendorReturnTest.php
          php -l tests/Feature/FinancialAuditRemediationProofTest.php
          php -l tests/Feature/PaystackPaymentHardeningTest.php
          php -l tests/Feature/ReturnsRefundsAndCollectionPointsTest.php

      - name: Run financial audit and payment hardening proof tests
        run: php artisan test tests/Feature/FinancialAuditRemediationProofTest.php tests/Feature/PaystackPaymentHardeningTest.php tests/Feature/ReturnsRefundsAndCollectionPointsTest.php tests/Feature/DoorstepPartialAcceptanceAndVendorReturnTest.php --display-warnings
