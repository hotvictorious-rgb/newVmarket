name: Paystack refund safety tests

on:
  pull_request:
    branches: [main, docs/retailer-central-fulfilment-model]
    paths:
      - "backend/app/Http/Controllers/Web/PaystackPaymentController.php"
      - "backend/app/Services/FinancialReconciliationEngine.php"
      - "backend/tests/Feature/FinancialAuditRemediationProofTest.php"
      - "backend/tests/Feature/PaystackPaymentHardeningTest.php"
      - "backend/**"
      - ".github/workflows/paystack-refund-safety.yml"
  push:
    branches:
      - audit/paystack-refund-webhook-safety
      - docs/retailer-central-fulfilment-model
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refund-safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_KEY: "base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI="
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, curl, dom, fileinfo, mbstring, pdo_sqlite, sqlite3, xml
          coverage: none

      - name: Prepare test environment
        run: touch .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check for changed files
        run: |
          php -l app/Http/Controllers/Web/PaystackPaymentController.php
          php -l app/Http/Controllers/Web/AdminSupplierOfferAvailabilityController.php
          php -l app/Http/Controllers/Web/PortalController.php
          php -l app/Http/Controllers/Api/CheckoutAndReservationApiController.php
          php -l app/Services/LogisticsCompanyPayableService.php
          php -l app/Services/CashbackMaturityService.php
          php -l app/Console/Commands/MatureCustomerCashbackCommand.php
          php -l app/Console/Commands/ReconcileSupplierPayablesCommand.php
          php -l routes/console.php
          php -l app/Services/DoorstepHandshakeService.php
          php -l app/Services/ReturnAndRefundService.php
          php -l app/Services/FinancialOperationService.php
          php -l app/Services/RetailerRefundAccountingService.php
          php -l app/Models/CashbackRecoveryLedger.php
          php -l app/Services/FinancialReconciliationEngine.php
          php -l app/Services/PayoutFinalizationService.php
          php -l app/Services/PaystackService.php
          php -l app/Services/ReturnAndRefundService.php
          php -l app/Services/DoorstepHandshakeService.php
          php -l app/Http/Controllers/Api/RiderTerminalApiController.php
          php -l app/Http/Controllers/Api/VendorTerminalApiController.php
          php -l app/Services/NotificationDispatchService.php
          php -l app/Services/CheckoutExecutionService.php
          php -l app/Services/SourcingAllocationService.php
          php -l app/Services/OrderSettlementService.php
          php -l app/Models/Order.php
          php -l app/Models/OrderItem.php
          php -l app/Models/SupplierOffer.php
          php -l app/Services/SupplierOfferSelectionService.php
          php -l app/Services/SupplierOfferAvailabilityService.php
          php -l app/Models/OrderSupplierAssignment.php
          php -l app/Http/Controllers/Web/AdminOrderSupplierAssignmentController.php
          php -l database/migrations/2026_10_21_000002_create_order_supplier_assignments_table.php
          php -l database/migrations/2026_10_21_000003_add_supplier_collection_proof_fields.php
          php -l database/migrations/2026_10_21_000005_add_supplier_snapshots_to_order_items.php
          php -l database/migrations/2026_10_21_000006_add_supplier_offer_availability_evidence.php
          php -l database/migrations/2026_10_21_000007_make_product_supplier_ownership_nullable.php
          php -l database/migrations/2026_10_21_000008_add_retailer_financial_snapshots_and_logistics_override.php
          php -l database/migrations/2026_10_21_000009_create_cashback_recovery_ledger.php
          php -l database/migrations/2026_10_20_000046_add_customer_address_id_to_orders.php
          php -l database/migrations/2026_10_20_000001_allow_cashback_maturity_to_start_after_fulfilment.php
          php -l database/migrations/2026_10_21_000004_create_supplier_offers_and_sourcing_fields.php
          php -l tests/Feature/DoorstepPartialAcceptanceAndVendorReturnTest.php
          php -l tests/Feature/FinancialAuditRemediationProofTest.php
          php -l tests/Feature/AdminTransferHardeningAndWalletIntegrityTest.php
          php -l tests/Feature/FinancialJournalIdempotencySchemaTest.php
          php -l tests/Feature/PaystackPaymentHardeningTest.php
          php -l tests/Feature/ReturnsRefundsAndPaystackSafetyTest.php
          php -l tests/Feature/FinancialLedgerAndCashbackLifecycleTest.php
          php -l tests/Feature/AuditHardeningAndChildOrderSettlementTest.php
          php -l tests/Feature/AuditHardeningAndSecurityProofTest.php
          php -l tests/Feature/VendorManagedDeliveryRiderTest.php
          php -l tests/Feature/StructuralEntityAndLogisticsInvariantTest.php
          php -l tests/Feature/VendorPayoutLifecycleTest.php
          php -l tests/Feature/VendorSettlementProtectionWindowTest.php
          php -l tests/Feature/WebCheckoutIdempotencyAndStateTransitionTest.php
          php -l tests/Feature/AdminLogisticsAndRiderManagementTest.php
          php -l tests/Feature/AdminSupplierOnboardingTest.php
          php -l tests/Feature/SupplierSourcingSnapshotSchemaTest.php
          php -l tests/Feature/SupplierOfferSelectionServiceTest.php
          php -l tests/Feature/AutomatedSupplierSourcingTest.php
          php -l tests/Feature/VendorCatalogConditionAndKekeSurchargeTest.php

      - name: Run financial audit and payment hardening proof tests
        run: php artisan test tests/Feature/FinancialAuditRemediationProofTest.php tests/Feature/AdminTransferHardeningAndWalletIntegrityTest.php tests/Feature/FinancialJournalIdempotencySchemaTest.php tests/Feature/PaystackPaymentHardeningTest.php tests/Feature/ReturnsRefundsAndPaystackSafetyTest.php tests/Feature/FinancialLedgerAndCashbackLifecycleTest.php tests/Feature/AuditHardeningAndChildOrderSettlementTest.php tests/Feature/AuditHardeningAndSecurityProofTest.php tests/Feature/VendorPayoutLifecycleTest.php tests/Feature/VendorSettlementProtectionWindowTest.php tests/Feature/WebCheckoutIdempotencyAndStateTransitionTest.php tests/Feature/AdminLogisticsAndRiderManagementTest.php tests/Feature/AdminSupplierOnboardingTest.php tests/Feature/SupplierSourcingSnapshotSchemaTest.php tests/Feature/SupplierOfferSelectionServiceTest.php tests/Feature/AutomatedSupplierSourcingTest.php tests/Feature/VendorCatalogConditionAndKekeSurchargeTest.php --display-warnings
