name: Paystack refund safety tests

on:
  pull_request:
    branches:
      - main
      - fix/mysql-production-test-alignment
    paths:
      - "backend/app/Http/Controllers/Web/PaystackPaymentController.php"
      - "backend/app/Services/FinancialReconciliationEngine.php"
      - "backend/tests/Feature/FinancialAuditRemediationProofTest.php"
      - "backend/tests/Feature/PaystackPaymentHardeningTest.php"
      - "backend/tests/Feature/ManualBankTransferReviewTest.php"
      - "backend/tests/Feature/AuditorDiscrepancyAlignmentTest.php"
      - "backend/**"
      - ".github/workflows/paystack-refund-safety.yml"
  push:
    branches:
      - main
      - docs/retailer-central-fulfilment-model
      - audit/policy-runtime-remediation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refund-safety:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: newvmarket_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      APP_KEY: "base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI="
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: newvmarket_test
      DB_USERNAME: root
      DB_PASSWORD: mysql
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, curl, dom, fileinfo, mbstring, pdo_mysql, pdo_sqlite, sqlite3, xml
          coverage: none

      - name: Prepare test environment
        run: touch .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check for changed PHP files
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$EVENT_BEFORE"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base SHA; changed-file check will be skipped."
          else
            CHANGED_PHP="$(git diff --name-only "$BASE_SHA" "$CURRENT_SHA" -- '*.php' | grep '^backend/' | sed 's#^backend/##' || true)"
            if [ -n "$CHANGED_PHP" ]; then
              while IFS= read -r file; do
                [ -z "$file" ] && continue
                [ ! -f "$file" ] && continue
                php -l "$file"
              done <<< "$CHANGED_PHP"
            else
              echo "No changed PHP files to lint."
            fi
          fi

      - name: Full backend PHP syntax scan
        run: |
          find app bootstrap config database routes tests -type f -name '*.php' -print0 |
            xargs -0 -r -n1 php -l

      - name: Migrate database schema
        run: php artisan migrate:fresh --force

      - name: Run financial audit and payment hardening proof tests
        run: |
          set -o pipefail
          php artisan test tests/Feature/FinancialAuditRemediationProofTest.php tests/Feature/AdminTransferHardeningAndWalletIntegrityTest.php tests/Feature/FinancialJournalIdempotencySchemaTest.php tests/Feature/PaystackPaymentHardeningTest.php tests/Feature/ManualBankTransferReviewTest.php tests/Feature/AuditorDiscrepancyAlignmentTest.php tests/Feature/ReturnsRefundsAndPaystackSafetyTest.php tests/Feature/ReverseLogisticsChainOfCustodyTest.php tests/Feature/FinancialLedgerAndCashbackLifecycleTest.php tests/Feature/AuditHardeningAndChildOrderSettlementTest.php tests/Feature/AuditHardeningAndSecurityProofTest.php tests/Feature/WebCheckoutIdempotencyAndStateTransitionTest.php tests/Feature/AdminLogisticsAndRiderManagementTest.php tests/Feature/AdminSupplierOnboardingTest.php tests/Feature/SupplierSourcingSnapshotSchemaTest.php tests/Feature/SupplierOfferSelectionServiceTest.php tests/Feature/SupplierPrivateCatalogPolicyTest.php tests/Feature/AutomatedSupplierSourcingTest.php tests/Feature/VendorCatalogConditionAndKekeSurchargeTest.php tests/Feature/PaymentTruthDurabilityTest.php tests/Feature/PaystackWebhookInboxRecoveryTest.php tests/Feature/PaymentCaptureExceptionResolutionTest.php tests/Feature/TreasuryBankCreditBatchTest.php tests/Feature/TreasuryBankCreditConcurrencyTest.php tests/Feature/SupplierFailoverConcurrencyTest.php tests/Feature/WholeOrderConsolidatedSourcingAndFleetDispatchTest.php tests/Feature/WebhookArchivalTest.php --display-warnings 2>&1 | tee test-output.log || {
            STATUS=$?
            echo "## Test Failure (refund-safety)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 150 test-output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $STATUS
          }

      - name: Run supplier bank update regression tests
        run: |
          php artisan test tests/Feature/SecurityHardeningAndAuditTest.php --filter='vendor_bank_update_activates_48h_cooldown_and_validates_10_digit_nuban' --display-warnings

  mysql-settlement-proof:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: newvmarket_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      APP_KEY: "base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI="
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: newvmarket_test
      DB_USERNAME: root
      DB_PASSWORD: mysql
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP with MySQL driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, curl, dom, fileinfo, mbstring, pdo_mysql, xml
          coverage: none

      - name: Prepare test environment
        run: touch .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Migrate database schema
        run: php artisan migrate:fresh --force

      - name: Run financial settlement proof tests on MySQL/InnoDB
        run: |
          set -o pipefail
          php artisan test \
            tests/Feature/PaystackPaymentHardeningTest.php tests/Feature/ManualBankTransferReviewTest.php \
            tests/Feature/FinancialAuditRemediationProofTest.php \
            tests/Feature/FinancialJournalIdempotencySchemaTest.php \
            tests/Feature/AdminTransferHardeningAndWalletIntegrityTest.php \
            tests/Feature/PaystackWebhookInboxRecoveryTest.php \
            tests/Feature/AutomatedSupplierSourcingTest.php \
            tests/Feature/SupplierPrivateCatalogPolicyTest.php \
            tests/Feature/PaymentCaptureExceptionResolutionTest.php \
            tests/Feature/TreasuryBankCreditBatchTest.php \
            tests/Feature/TreasuryBankCreditConcurrencyTest.php tests/Feature/SupplierFailoverConcurrencyTest.php \
            tests/Feature/AuditorDiscrepancyAlignmentTest.php \
            tests/Feature/ReverseLogisticsChainOfCustodyTest.php \
            --display-warnings 2>&1 | tee mysql-test-output.log || {
            STATUS=$?
            echo "## Test Failure (mysql-settlement-proof)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 150 mysql-test-output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $STATUS
          }

