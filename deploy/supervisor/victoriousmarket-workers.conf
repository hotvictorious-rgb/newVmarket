; ==============================================================================
; VICTORIOUS MARKET — SUPERVISOR QUEUE WORKERS & CRON SCHEDULER
; High-Availability, Fault-Tolerant Background Worker Fleet
; ==============================================================================

; Tier 1: Critical Financial & Communication Pipeline (OTP, SMS, Webhooks)
[program:victorious-worker-high]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/victoriousmarket/backend/artisan queue:work redis --queue=high,sms,otp,webhooks --sleep=1 --tries=3 --max-time=3600 --timeout=60
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/victorious-worker-high.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10

; Tier 2: Core Marketplace Processing (Orders, Payments, Delivery Assignments, FCM)
[program:victorious-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/victoriousmarket/backend/artisan queue:work redis --queue=default,orders,notifications --sleep=2 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/victorious-worker-default.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10

; Tier 3: Asynchronous Heavy Operations (Nightly Backups, Ledger Audits, Google Drive)
[program:victorious-worker-low]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/victoriousmarket/backend/artisan queue:work redis --queue=backups,reports,maintenance --sleep=5 --tries=2 --max-time=3600 --timeout=600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/victorious-worker-low.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

; Tier 4: Background Cron Scheduler Engine (Nightly 02:00 UTC Backups & Reconciliations)
[program:victorious-scheduler]
process_name=%(program_name)s
command=php /var/www/victoriousmarket/backend/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/victorious-scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5