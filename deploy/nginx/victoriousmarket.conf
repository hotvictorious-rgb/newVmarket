# ==============================================================================
# VICTORIOUS MARKET — PRODUCTION NGINX CONFIGURATION
# High-Throughput, SSL Hardened, Rate-Limited Gateway
# ==============================================================================

# Rate Limiting Zones (Allocated per client IP)
limit_req_zone $binary_remote_addr zone=general_api:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=auth_throttle:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pay_throttle:10m rate=30r/m;

# 1. HTTP to HTTPS Canonical Redirect
server {
    listen 80;
    listen [::]:80;
    server_name victoriousmarket.com.ng api.victoriousmarket.com.ng shop.victoriousmarket.com.ng;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Unified Gateway
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name victoriousmarket.com.ng api.victoriousmarket.com.ng shop.victoriousmarket.com.ng;

    root /var/www/victoriousmarket/backend/public;
    index index.php index.html;

    # SSL Certificates (Managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/victoriousmarket.com.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/victoriousmarket.com.ng/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/victoriousmarket.com.ng/chain.pem;

    # TLS Protocols & High-Security Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Enterprise Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Maximum file upload size (High-res product images, inspection photos)
    client_max_body_size 15M;
    client_body_buffer_size 128k;

    # Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Assets & Frontend Bundles (Long-lived cache)
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Paystack Webhook Ingestion (Signature-Protected, Bypasses Rate Limiting)
    location /api/v1/payments/paystack/webhook {
        try_files $uri $uri/ /index.php?$query_string;
        proxy_read_timeout 120s;
    }

    # Sensitive Auth Endpoints (Brute-Force Protected)
    location ~ ^/(api/v1/auth/login|login|customer/login|admin/login|vendor/login|rider/login) {
        limit_req zone=auth_throttle burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Payment & Checkout Endpoints (Controlled Concurrency)
    location ~ ^/(api/v1/checkout|api/v1/payments|paystack/pay) {
        limit_req zone=pay_throttle burst=10 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # API Routes (Rate-Limited General API)
    location /api/ {
        limit_req zone=general_api burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Standard Application Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Processor
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # FastCGI Buffer Tuning
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 60;
        fastcgi_intercept_errors off;
    }

    # Block Access to Hidden & Sensitive Files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~ ^/(storage/credentials/|\.env|\.git) {
        deny all;
        return 404;
    }

    # Logging
    access_log /var/log/nginx/victorious_access.log combined;
    error_log /var/log/nginx/victorious_error.log warn;
}